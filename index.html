<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <!-- Lets the page open full screen (no browser bars) when added to the home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>Bunana AR</title>

  <!-- A-Frame + MindAR image tracking (versions tested together) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // Camera start fix: iPhones sometimes report one camera size, then switch to another a moment later.
    // MindAR would lock in the first size (black bars + video drawn too large). Here we wait until the
    // camera size is stable before starting tracking, and restart tracking if it changes afterwards.
    (function () {
      const Sys = AFRAME.systems['mindar-image-system'].prototype;
      Sys._startVideo = function () {
        const v = this.video = document.createElement('video');
        v.setAttribute('autoplay', ''); v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
        v.muted = true;
        v.style.cssText = 'position:absolute;top:0;left:0;z-index:-2';
        this.container.appendChild(v);

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          this.el.emit('arError', { error: 'VIDEO_FAIL' }); this.ui.showCompatibility(); return;
        }
        navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: 'environment' } }).then((stream) => {
          v.addEventListener('loadedmetadata', async () => {
            try { await v.play(); } catch (e) {}
            // wait until the size has been the same for 400 ms (at most 2.5 s)
            let last = v.videoWidth + 'x' + v.videoHeight, since = performance.now(); const t0 = since;
            while (performance.now() - t0 < 2500) {
              await new Promise(r => setTimeout(r, 100));
              const cur = v.videoWidth + 'x' + v.videoHeight;
              if (cur !== last) { last = cur; since = performance.now(); }
              else if (performance.now() - since >= 400) break;
            }
            if (v !== this.video) return;              // a restart already replaced this camera
            v.setAttribute('width', v.videoWidth); v.setAttribute('height', v.videoHeight);
            this._inW = v.videoWidth; this._inH = v.videoHeight;
            this._startAR();
            v.addEventListener('resize', () => {
              if (v !== this.video || !this.controller || this._restarting) return;
              if (v.videoWidth && (v.videoWidth !== this._inW || v.videoHeight !== this._inH)) {
                this._restarting = true;
                setTimeout(() => { this.stop(); this._restarting = false; this.start(); }, 300);
              }
            });
          }, { once: true });
          v.srcObject = stream;
        }).catch((err) => {
          console.log('getUserMedia error', err);
          this.el.emit('arError', { error: 'VIDEO_FAIL' });
        });
      };
    })();
  </script>

  <style>
    /* Black goes on <html> only: a background on <body> would cover the live camera feed */
    html { background: #000; height: 100%; }
    body { margin: 0; position: fixed; inset: 0; overflow: hidden; background: transparent;
           font-family: -apple-system, system-ui, sans-serif; }
    #start { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
             align-items: center; justify-content: center; gap: 20px; padding: 24px;
             background: #000; color: #fff; text-align: center; }
    #start p { font-size: 18px; line-height: 1.4; max-width: 320px; margin: 0; }
    #startBtn { font-size: 18px; font-weight: 600; padding: 14px 36px; border: 0;
                border-radius: 999px; background: #fff; color: #111; }
    #hint { position: fixed; left: 0; right: 0; bottom: 32px; z-index: 5; display: none;
            text-align: center; color: #fff; font-size: 16px;
            text-shadow: 0 1px 4px rgba(0,0,0,.8); pointer-events: none; }
  </style>

  <script>
    // Tuning from the link, e.g. ?smooth=0.15&cf=0.0001&beta=0.001
    const params = new URLSearchParams(location.search);
    const TUNE = {
      smooth: parseFloat(params.get('smooth') ?? '0.5'),   // 0.05 = very smooth/slow ... 1 = no extra smoothing
      cf:     parseFloat(params.get('cf')     ?? '0.00005'), // MindAR filter: lower = steadier when still
      beta:   parseFloat(params.get('beta')   ?? '1'),  // MindAR filter: higher = less lag when moving
      feather: parseFloat(params.get('feather') ?? '0'), // soft edge, as a share of the video's width (0 = hard edge)
      match:  parseFloat(params.get('match')  ?? '1'),      // colour matching to the camera: 0 = off, 1 = full
      debug:  params.get('debug') === '1',                  // show the measured colour correction on screen
    };
    const ASPECT = 1.4; // print height / width

    // Colour matching: measure the print's white backdrop as the camera sees it,
    // compare with its true colour in the file, and tint/dim the video the same way.
    AFRAME.registerComponent('color-match', {
      schema: { target: { type: 'selector' } },
      init() {
        this.canvas = document.createElement('canvas');
        this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
        this.REF = [236.7, 236.0, 240.5];          // average sRGB of the white backdrop in the print file
        this.pts = [];                             // sample grid over that backdrop (u across, v down from top)
        for (let i = 0; i < 7; i++) for (let j = 0; j < 5; j++) this.pts.push([0.12 + 0.76 * i / 6, 0.04 + 0.26 * j / 4]);
        this.v = new THREE.Vector3(); this.gain = null; this.last = 0;
        if (TUNE.debug) {
          this.dbg = document.createElement('div');
          this.dbg.style.cssText = 'position:fixed;top:8px;left:8px;z-index:20;color:#fff;font:12px monospace;background:rgba(0,0,0,.5);padding:4px 6px;border-radius:4px';
          document.body.appendChild(this.dbg);
        }
      },
      tick(time) {
        if (TUNE.match <= 0 || time - this.last < 200) return;
        this.last = time;
        const src = this.data.target.object3D;
        const sys = this.el.sceneEl.systems['mindar-image-system'];
        const video = sys && sys.video, mesh = this.el.getObject3D('mesh');
        if (!src.visible || !video || !video.videoWidth || !mesh) return;

        const cw = Math.round(video.videoWidth / 4), ch = Math.round(video.videoHeight / 4);
        if (this.canvas.width !== cw || this.canvas.height !== ch) { this.canvas.width = cw; this.canvas.height = ch; }
        this.ctx.drawImage(video, 0, 0, cw, ch);
        const data = this.ctx.getImageData(0, 0, cw, ch).data;

        const cam = this.el.sceneEl.camera;
        const cr = this.el.sceneEl.canvas.getBoundingClientRect(), vr = video.getBoundingClientRect();
        src.updateMatrixWorld(true);
        const sum = [0, 0, 0]; let n = 0;
        for (const [u, v] of this.pts) {
          this.v.set(u - 0.5, (0.5 - v) * ASPECT, 0).applyMatrix4(src.matrixWorld).project(cam);
          const sx = (this.v.x + 1) / 2 * cr.width + cr.left, sy = (1 - this.v.y) / 2 * cr.height + cr.top;
          const px = Math.floor((sx - vr.left) / vr.width * cw), py = Math.floor((sy - vr.top) / vr.height * ch);
          if (px < 1 || py < 1 || px >= cw - 1 || py >= ch - 1) continue;
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            const k = ((py + dy) * cw + (px + dx)) * 4;
            sum[0] += data[k]; sum[1] += data[k + 1]; sum[2] += data[k + 2]; n++;
          }
        }
        if (n < 45) return;                        // fewer than 5 sample points on screen: keep last value

        const g = sum.map((t, i) => Math.min(1.2, Math.max(0.3, (t / n) / this.REF[i])));
        this.gain = this.gain ? this.gain.map((x, i) => x + (g[i] - x) * 0.3) : g;
        const lin = this.gain.map(x => Math.pow(1 + (x - 1) * TUNE.match, 2.2));   // sRGB ratio -> linear
        mesh.material.color.setRGB(lin[0], lin[1], lin[2]);
        if (this.dbg) this.dbg.textContent = 'R ' + this.gain[0].toFixed(2) + '  G ' + this.gain[1].toFixed(2) + '  B ' + this.gain[2].toFixed(2);
      }
    });

    // Soft edges: a generated alpha mask that fades the video out toward its sides
    AFRAME.registerComponent('feather', {
      schema: { aspect: { default: 1.4 } },          // height / width of the video
      init() {
        const f = Math.max(0, TUNE.feather);
        const W = 256, H = Math.round(256 * this.data.aspect);
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const ctx = c.getContext('2d'); const img = ctx.createImageData(W, H);
        const fx = f, fy = f / this.data.aspect;      // same physical edge width on all four sides
        const ramp = (t, w) => { if (w <= 0) return 1; const x = Math.min(1, Math.max(0, t / w)); return x * x * (3 - 2 * x); };
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
          const u = (x + 0.5) / W, v = (y + 0.5) / H;
          const a = ramp(Math.min(u, 1 - u), fx) * ramp(Math.min(v, 1 - v), fy);
          const i = (y * W + x) * 4, g = Math.round(a * 255);
          img.data[i] = img.data[i + 1] = img.data[i + 2] = g; img.data[i + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
        this.mask = new THREE.CanvasTexture(c);
        this.apply = this.apply.bind(this);
        this.el.addEventListener('materialtextureloaded', this.apply);
      },
      tick() { if (!this.done) this.apply(); },
      apply() {
        const mesh = this.el.getObject3D('mesh');
        if (!mesh || !mesh.material) return;
        mesh.material.alphaMap = this.mask;
        mesh.material.transparent = true;
        mesh.material.needsUpdate = true;
        this.done = true;
      }
    });

    AFRAME.registerComponent('smooth-follow', {
      schema: { target: { type: 'selector' } },
      init() {
        this.p = new THREE.Vector3(); this.q = new THREE.Quaternion(); this.s = new THREE.Vector3();
        this.snap = true;
        this.el.object3D.visible = false;
      },
      tick(time, dt) {
        const src = this.data.target.object3D;
        const obj = this.el.object3D;
        if (!src.visible) { obj.visible = false; this.snap = true; return; }
        src.updateMatrixWorld(true);
        src.matrixWorld.decompose(this.p, this.q, this.s);
        if (this.snap) {                       // first frame after finding the print: jump into place
          obj.position.copy(this.p); obj.quaternion.copy(this.q); obj.scale.copy(this.s);
          this.snap = false;
        } else {                               // then ease toward it, independent of frame rate
          const k = 1 - Math.pow(1 - Math.min(TUNE.smooth, 1), (dt || 16.7) / 16.7);
          obj.position.lerp(this.p, k); obj.quaternion.slerp(this.q, k); obj.scale.lerp(this.s, k);
        }
        obj.visible = true;
      }
    });
  </script>
</head>
<body>

  <!-- Start screen: the tap is needed so phones allow the video to play with sound -->
  <div id="start">
    <p>Point your camera at the print to bring it to life.</p>
    <button id="startBtn">Start</button>
  </div>
  <div id="hint">Point your camera at the print</div>


  <!--
    FILES THIS PAGE NEEDS (in the same folder):
      targets.mind  - made from your print image with the MindAR compiler
      video.mp4     - your video, cropped to the same shape as the print
  -->
  <a-scene id="scene"
           mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiScanning: no; missTolerance: 5; warmupTolerance: 16"
           color-space="sRGB"
           renderer="colorManagement: true; physicallyCorrectLights: true"
           vr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="vid" src="video.mp4" preload="auto" loop muted
             playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Raw tracking anchor (moves with every tracking update) -->
    <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>

    <!-- Smoothed copy of the anchor: the video lives here so it glides instead of shaking -->
    <a-entity id="follower" smooth-follow="target: #target">
      <!--
        SIZE: width is always 1 (= the print's width).
        height = print height / print width  (5:7 portrait -> 1.4)
      -->
      <a-video src="#vid" width="1" height="1.4" position="0 0 0" feather="aspect: 1.4" color-match="target: #target"></a-video>
    </a-entity>
  </a-scene>

  <script>
    const scene    = document.getElementById('scene');
    const target   = document.getElementById('target');
    const video    = document.getElementById('vid');
    const startEl  = document.getElementById('start');
    const startBtn = document.getElementById('startBtn');
    const hint     = document.getElementById('hint');

    function sceneReady() {
      return new Promise(res => scene.hasLoaded ? res() : scene.addEventListener('loaded', res, { once: true }));
    }

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.textContent = 'Starting…';

      // Unlock video playback (with sound) while we still have the user's tap
      try {
        await video.play();
        video.pause();
        video.currentTime = 0;
      } catch (e) {
        video.muted = true; // fall back to muted if the phone refuses sound
      }

      await sceneReady();
      startEl.style.display = 'none';
      hint.style.display = 'block';
      const ar = scene.systems['mindar-image-system'];
      ar.filterMinCF = TUNE.cf;
      ar.filterBeta  = TUNE.beta;
      await ar.start();
    });

    target.addEventListener('targetFound', () => {
      hint.style.display = 'none';
      video.play().catch(() => { video.muted = true; video.play(); });
    });

    target.addEventListener('targetLost', () => {
      hint.style.display = 'block';
      video.pause();
    });
  </script>
</body>
</html>
